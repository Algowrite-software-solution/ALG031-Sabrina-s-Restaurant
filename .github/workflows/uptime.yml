name: Website Uptime Monitor

on:
  schedule:
    # Runs every 5 minutes in background
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      send_report:
        description: 'Send live status report to Discord right now?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write # Needed to persist uptime_state.json across runs

jobs:
  uptime-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Uptime State from uptime-state Branch
        run: |
          git fetch origin uptime-state:refs/remotes/origin/uptime-state || true
          if git show origin/uptime-state:uptime_state.json > uptime_state.json 2>/dev/null; then
            echo "Successfully loaded previous uptime_state.json from uptime-state branch."
          else
            echo "No existing uptime_state.json found on uptime-state branch, initializing empty state."
            echo "{}" > uptime_state.json
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Run Uptime Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_REPORT: ${{ github.event.inputs.send_report == 'true' && 'true' || 'false' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.send_report }}" = "true" ]; then
            php monitor.php --report
          else
            php monitor.php
          fi

      - name: Persist State to uptime-state Branch (Zero Commits on Main)
        run: |
          if [ -f uptime_state.json ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            # Fetch remote uptime-state branch if it exists, or create orphan branch in temporary worktree
            git worktree add ../uptime-state-branch uptime-state 2>/dev/null || \
              (git checkout --orphan uptime-state && git rm -rf . && git commit --allow-empty -m "init uptime-state" && git checkout main && git worktree add ../uptime-state-branch uptime-state)

            cp uptime_state.json ../uptime-state-branch/uptime_state.json
            cd ../uptime-state-branch
            git add uptime_state.json
            if ! git diff --quiet --cached; then
              git commit -m "chore: update uptime state [skip ci]"
              git push origin uptime-state
            else
              echo "No changes in uptime state, skipping push."
            fi
          fi
