name: Website Uptime Monitor

on:
  schedule:
    # Runs every 5 minutes (standard cron expression)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write # Needed to persist uptime_state.json across runs

jobs:
  uptime-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Run Uptime Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: php monitor.php

      - name: Commit & Push Updated Uptime State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uptime_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update uptime state [skip ci]" && git push)
