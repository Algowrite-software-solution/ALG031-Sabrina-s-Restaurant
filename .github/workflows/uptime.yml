name: Website Uptime Monitor

on:
  schedule:
    # Runs every 5 minutes in background
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      send_report:
        description: 'Send live status report to Discord right now?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write # Needed to persist uptime_state.json across runs

jobs:
  uptime-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Run Uptime Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_REPORT: ${{ github.event.inputs.send_report == 'true' && 'true' || 'false' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.send_report }}" = "true" ]; then
            php monitor.php --report
          else
            php monitor.php
          fi

      - name: Commit & Push Updated Uptime State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uptime_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update uptime state [skip ci]" && git push)
